<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiries | Ashley's Sewing Company</title>
    <meta name="description" content="Enquire about sewing, dressmaking and clothing alteration services.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h1>Make an Enquiry</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
        <a href="FAQ.html">FAQ</a>
    </nav>
</header>

<section class="content">
    <h2>Request a Sewing Service</h2>

    <form id="enquiryForm">

        <label for="customerName">Full Name:</label>
        <input type="text" id="customerName"
               required minlength="2">

        <label for="service">Choose a Service:</label>
        <select id="service" required>
            <option value="">Select a service</option>
            <option value="dressmaking">Dressmaking</option>
            <option value="alterations">Clothing Alterations</option>
            <option value="custom">Custom Designs</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity"
               min="1" max="100" required>

        <button type="submit">Calculate Estimated Price</button>

        <p id="priceResult" aria-live="polite"></p>

    </form>
</section>

<footer>
    <p>&copy; 2026 Ashley's Sewing Company</p>
</footer>

</body>
</html>
